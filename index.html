<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Defend Your Dome — Solarpunk Draft</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; background:#0e2018; color:#eaf6ee; font-family:'Segoe UI', system-ui, sans-serif; overflow:hidden; }
  #wrap { display:flex; flex-direction:column; align-items:center; height:100%; }
  #hud { width:100%; max-width:1100px; display:flex; gap:8px; padding:8px; flex-wrap:wrap; align-items:center; }
  #hud .grow { flex:1; }
  canvas { border-radius:10px; max-width:100%; touch-action:manipulation; box-shadow:0 4px 30px #0008; }
  button { background:#1e4034; color:#eaf6ee; border:1px solid #3f7f62; border-radius:10px;
           padding:10px 12px; font-size:13px; cursor:pointer; min-width:86px; text-align:center; }
  button:hover:not(:disabled) { background:#2a5a48; }
  button:disabled { opacity:.4; cursor:default; }
  button .cost { display:block; font-size:11px; color:#ffd76a; }
  #gold { font-size:18px; font-weight:700; color:#ffd76a; min-width:110px; }
  #cannonRow { width:100%; max-width:1100px; display:flex; gap:8px; padding:0 8px 8px; align-items:center; }
  #abilityRow { width:100%; max-width:1100px; display:flex; gap:8px; padding:0 8px 8px; align-items:center; }
  #abilityRow button { border-color:#6a5cff; background:#2a2650; position:relative; overflow:hidden; }
  #abilityRow button:hover:not(:disabled) { background:#3a3570; }
  #abilityRow button .cd { position:absolute; left:0; bottom:0; height:3px; background:#a89bff; width:0%; }
  #overlay { position:fixed; inset:0; background:rgba(8,18,13,.85); display:none;
             flex-direction:column; align-items:center; justify-content:center; gap:16px; z-index:10; }
  #overlay h1 { font-size:42px; }
  .tag { font-size:11px; color:#9fd4b8; }
</style>
</head>
<body>
<div id="wrap">
  <div id="hud">
    <div id="gold">☀ 0</div>
    <button id="bGrunt"></button>
    <button id="bArcher"></button>
    <button id="bTank"></button>
    <button id="bEcon"></button>
    <div class="grow"></div>
  </div>
  <div id="cannonRow">
    <span class="tag" id="cannonStatus">Solar Cannon:</span>
    <button id="bBuild"></button>
    <button id="bRange"></button>
    <button id="bDamage"></button>
  </div>
  <div id="abilityRow">
    <span class="tag" id="abilityLabel">Ammo:</span>
    <button id="bVine"></button>
    <button id="bBomb"></button>
    <button id="bVoid"></button>
  </div>
  <canvas id="cv" width="1100" height="520"></canvas>
</div>

<div id="overlay">
  <h1 id="ovTitle"></h1>
  <p id="ovSub"></p>
  <button id="bReplay">Play again</button>
</div>

<script>
'use strict';
const W = 1100, H = 520, GROUND = 440;
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');

// ---------- config ----------
const UNITS = {
  grunt:  { cost: 50,  hp: 100, dmg: 12, range: 26,  speed: 55, atkCd: 0.8, size: 1.0, reward: 30,  label: '⚔️ Warden' },
  archer: { cost: 90,  hp: 60,  dmg: 15, range: 170, speed: 45, atkCd: 1.1, size: 0.9, reward: 55,  label: '🏹 Thornshot' },
  tank:   { cost: 180, hp: 380, dmg: 22, range: 30,  speed: 30, atkCd: 1.3, size: 1.35, reward: 110, label: '🛡️ Oakguard' },
};
const ECON_COSTS = [150, 300, 600];         // sun-harvest upgrade costs
const CANNON_BUILD_COST = 300;
const CANNON_UPG_COSTS  = [250, 450, 700];  // 1st (forced range), 2nd, 3rd
const CANNON_RANGES = [0.52, 0.78, 1.0];    // fraction of field reachable per range level (1..3)
const CANNON_DMGS   = [70, 140, 230];       // damage per damage level (1..3)

// special cannon ammo (tap-to-fire abilities), all unlocked once the cannon is built
const ABILITIES = {
  vine: { cd: 8,  label: '🌿 Vine',  radius: 72, rootDur: 2.5, thornDps: 16 },
  bomb: { cd: 12, label: '💥 Bomb',  radius: 92, dmg: 190 },
  void: { cd: 15, label: '🕳 Void',  radius: 120, dur: 2.0, pull: 95 },
};
const SHELL_COLORS = { basic: '#fff6d8', vine: '#9dff7a', bomb: '#ffb15a', void: '#c69bff', ebasic: '#c8ff5e' };

// difficulty / level flags (single level for now; future levels flip these on)
const DIFFICULTY = { enemyCannonHitsBase: false };

// palette
const PAL = {
  allySil: '#16343a', allyGlow: '#5cffc4',
  foeSil:  '#301c1c', foeGlow:  '#ff8a4d',
  shell:   '#ffe27a',
};

// ---------- state ----------
const P = { hp: 1000, maxHp: 1000, gold: 120, income: 6, econLvl: 0, x: 60 };
const E = { hp: 1000, maxHp: 1000, gold: 120, income: 6, x: W - 60 };
const cannon = { built: false, upgrades: 0, rangeLvl: 0, dmgLvl: 0, cd: 0, fireRate: 3.2,
                 abilityCd: { vine: 0, bomb: 0, void: 0 } };
const ecannon = { cd: 2.5, fireRate: 4.5, rangeFrac: 0.5, dmg: 30, radius: 46 };  // enemy cannon: troop-only
let units = [], shells = [], parts = [], texts = [], smoke = [], voids = [], vines = [];
let over = false, time = 0;

function spawn(side, type) {
  const u = UNITS[type];
  units.push({ side, type, hp: u.hp, maxHp: u.hp, x: side === 1 ? P.x + 40 : E.x - 40,
               cd: 0, phase: Math.random() * 7, root: 0, thornCd: 0 });
}

// ---------- player actions ----------
const $ = id => document.getElementById(id);
function tryBuy(cost, fn) { if (!over && P.gold >= cost) { P.gold -= cost; fn(); } }
$('bGrunt').onclick  = () => tryBuy(UNITS.grunt.cost,  () => spawn(1, 'grunt'));
$('bArcher').onclick = () => tryBuy(UNITS.archer.cost, () => spawn(1, 'archer'));
$('bTank').onclick   = () => tryBuy(UNITS.tank.cost,   () => spawn(1, 'tank'));
$('bEcon').onclick   = () => { if (P.econLvl < ECON_COSTS.length)
  tryBuy(ECON_COSTS[P.econLvl], () => { P.econLvl++; P.income += 4; }); };
$('bBuild').onclick  = () => tryBuy(CANNON_BUILD_COST, () => {
  cannon.built = true; cannon.rangeLvl = 1; cannon.dmgLvl = 1; });
$('bRange').onclick  = () => upgradeCannon('range');
$('bDamage').onclick = () => upgradeCannon('dmg');
$('bVine').onclick   = () => fireAbility('vine');
$('bBomb').onclick   = () => fireAbility('bomb');
$('bVoid').onclick   = () => fireAbility('void');

function fireAbility(kind) {
  if (over || !cannon.built || cannon.abilityCd[kind] > 0) return;
  const maxX = cannonRangeX();
  const inRange = units.filter(u => u.side === -1 && u.x <= maxX);
  let tx = null;
  // enemies advance leftward (smaller x = closer to your dome)
  if (kind === 'void') {
    // drop the black hole BEHIND the pack (largest x) so it drags troops back toward the enemy base
    if (inRange.length) tx = Math.max(...inRange.map(u => u.x));
  } else {
    // vine / bomb hit the most advanced threat (smallest x); fall back to the base if reachable
    if (inRange.length) tx = Math.min(...inRange.map(u => u.x));
    else if (maxX >= E.x - 30) tx = E.x;
  }
  if (tx === null) return;
  cannon.abilityCd[kind] = ABILITIES[kind].cd;
  shells.push({ x: P.x, y: 120, tx, t: 0, dur: 0.85, side: 1, type: kind });
}

function upgradeCannon(kind) {
  if (!cannon.built || cannon.upgrades >= 3) return;
  if (cannon.upgrades === 0 && kind !== 'range') return;   // first upgrade must be range
  if (kind === 'range' && cannon.rangeLvl >= 3) return;
  if (kind === 'dmg'   && cannon.dmgLvl   >= 3) return;
  tryBuy(CANNON_UPG_COSTS[cannon.upgrades], () => {
    if (kind === 'range') cannon.rangeLvl++; else cannon.dmgLvl++;
    cannon.upgrades++;
  });
}

// ---------- enemy AI ----------
let aiTimer = 1.5, aiWave = 0;
function aiThink(dt) {
  E.gold += E.income * dt * (1 + time / 240);  // enemy economy scales slowly
  aiTimer -= dt;
  if (aiTimer > 0) return;
  const pick = ['grunt','grunt','archer','grunt','tank'][aiWave % 5];
  if (E.gold >= UNITS[pick].cost) {
    E.gold -= UNITS[pick].cost;
    spawn(-1, pick);
    aiWave++;
    aiTimer = Math.max(1.6, 4.5 - time / 60);  // spawns speed up over time
  } else aiTimer = 0.5;
}

// ---------- cannon ----------
function cannonRangeX() { return P.x + (E.x - P.x) * CANNON_RANGES[cannon.rangeLvl - 1]; }
function cannonDmg()    { return CANNON_DMGS[cannon.dmgLvl - 1]; }
function enemyCannonReachX() { return E.x - (E.x - P.x) * ecannon.rangeFrac; }
function cannonTick(dt) {
  if (!cannon.built) return;
  for (const k in cannon.abilityCd) if (cannon.abilityCd[k] > 0) cannon.abilityCd[k] -= dt;
  cannon.cd -= dt;
  if (cannon.cd > 0) return;
  const maxX = cannonRangeX();
  // furthest enemy troop in range; if none and base reachable, shell the base
  let target = null;
  for (const u of units) if (u.side === -1 && u.x <= maxX && (!target || u.x > target.x)) target = u;
  let tx = null;
  if (target) tx = target.x;
  else if (maxX >= E.x - 30) tx = E.x;
  if (tx === null) return;
  cannon.cd = cannon.fireRate;
  shells.push({ x: P.x, y: 120, tx, t: 0, dur: 0.9, side: 1, type: 'basic' });
}
function enemyCannonTick(dt) {
  ecannon.cd -= dt;
  if (ecannon.cd > 0) return;
  const reachX = enemyCannonReachX();
  // target the player troop that has pushed furthest toward the enemy (largest x) within reach
  let target = null;
  for (const u of units) if (u.side === 1 && u.x >= reachX && (!target || u.x > target.x)) target = u;
  if (!target) { ecannon.cd = 1; return; }
  ecannon.cd = ecannon.fireRate;
  shells.push({ x: E.x, y: 120, tx: target.x, t: 0, dur: 0.9, side: -1, type: 'ebasic' });
}
function shellTick(dt) {
  for (const s of shells) {
    s.t += dt;
    if (s.t < s.dur) continue;
    s.dead = true;
    const foeSide = -s.side;                       // whom this shell hurts
    if (s.type === 'basic') {                       // player auto shell: single-target, splash only after a Damage upgrade
      boom(s.tx, GROUND);
      const dmg = cannonDmg();
      const r = cannon.dmgLvl >= 2 ? 55 : 22;
      for (const u of units) if (u.side === foeSide && Math.abs(u.x - s.tx) < r) hit(u, dmg);
      if (Math.abs(E.x - s.tx) < 60) { E.hp -= dmg; floatText(E.x, GROUND - 130, '-' + dmg, '#ff8a4d'); }
    } else if (s.type === 'ebasic') {               // enemy cannon: hits your troops only (never the base at this difficulty)
      boom(s.tx, GROUND, 10);
      for (const u of units) if (u.side === foeSide && Math.abs(u.x - s.tx) < ecannon.radius) hit(u, ecannon.dmg);
      if (DIFFICULTY.enemyCannonHitsBase && Math.abs(P.x - s.tx) < 60) { P.hp -= ecannon.dmg; floatText(P.x, GROUND - 130, '-' + ecannon.dmg, '#c8ff5e'); }
    } else if (s.type === 'vine') {                 // roots enemies; thorn damage-over-time while rooted
      const a = ABILITIES.vine;
      vines.push({ x: s.tx, life: a.rootDur + 0.6 });
      for (const u of units) if (u.side === foeSide && Math.abs(u.x - s.tx) < a.radius) u.root = a.rootDur;
      floatText(s.tx, GROUND - 60, 'ROOTED', '#9dff7a');
    } else if (s.type === 'bomb') {                 // dedicated big-splash bullet
      boom(s.tx, GROUND, 26);
      const a = ABILITIES.bomb;
      for (const u of units) if (u.side === foeSide && Math.abs(u.x - s.tx) < a.radius) hit(u, a.dmg);
      if (Math.abs(E.x - s.tx) < a.radius + 20) { E.hp -= a.dmg; floatText(E.x, GROUND - 130, '-' + a.dmg, '#ffb15a'); }
    } else if (s.type === 'void') {                 // black hole: pull field that drags enemies toward it
      voids.push({ x: s.tx, t: 0, dur: ABILITIES.void.dur });
      floatText(s.tx, GROUND - 60, 'VOID', '#c69bff');
    }
  }
  shells = shells.filter(s => !s.dead);
}
function applyVoids(dt) {
  const a = ABILITIES.void;
  for (const v of voids) {
    v.t += dt;
    for (const u of units) {
      if (u.side !== -1) continue;
      const d = v.x - u.x;
      if (Math.abs(d) < a.radius) u.x += Math.sign(d) * Math.min(Math.abs(d), a.pull * dt);
    }
  }
  voids = voids.filter(v => v.t < v.dur);
  for (const vn of vines) vn.life -= dt;
  vines = vines.filter(vn => vn.life > 0);
}

// ---------- combat ----------
function hit(u, dmg) {
  u.hp -= dmg;
  if (u.hp <= 0 && !u.dead) {
    u.dead = true;
    boom(u.x, GROUND - 18, 6);
    if (u.side === -1) { P.gold += UNITS[u.type].reward; floatText(u.x, GROUND - 44, '+' + UNITS[u.type].reward, '#ffd76a'); }
  }
}
function unitTick(dt) {
  for (const u of units) {
    const cfg = UNITS[u.type];
    u.cd -= dt;
    // rooted by vines: can't move; thorns bite over time
    if (u.root > 0) {
      u.root -= dt;
      u.thornCd -= dt;
      if (u.thornCd <= 0) { u.thornCd = 0.5; hit(u, ABILITIES.vine.thornDps * 0.5); }
    }
    // nearest opposing unit ahead
    let foe = null, foeD = 1e9;
    for (const v of units) {
      if (v.side === u.side || v.dead) continue;
      const d = (v.x - u.x) * u.side;
      if (d >= -5 && d < foeD) { foeD = d; foe = v; }
    }
    const baseX = u.side === 1 ? E.x : P.x;
    const baseD = (baseX - u.x) * u.side - 30;
    if (foe && foeD <= cfg.range) {
      if (u.cd <= 0) { u.cd = cfg.atkCd; hit(foe, cfg.dmg); }
    } else if (baseD <= cfg.range) {
      if (u.cd <= 0) {
        u.cd = cfg.atkCd;
        if (u.side === 1) E.hp -= cfg.dmg; else P.hp -= cfg.dmg;
      }
    } else if (u.root <= 0) {
      // friendly troops pass freely through each other; enemies keep formation (block on the unit ahead)
      let block = false;
      if (u.side === -1) {
        for (const v of units) {
          if (v === u || v.side !== u.side || v.dead) continue;
          const d = (v.x - u.x) * u.side;
          if (d > 0 && d < 16 * cfg.size + 16 * UNITS[v.type].size) { block = true; break; }
        }
      }
      if (!block) u.x += cfg.speed * u.side * dt;
    }
  }
  units = units.filter(u => !u.dead);
}

// ---------- fx ----------
function boom(x, y, n = 14) {
  for (let i = 0; i < n; i++) parts.push({ x, y, vx: (Math.random()-.5)*260, vy: -Math.random()*220,
    life: .5 + Math.random()*.3, color: Math.random() < .5 ? '#ffe27a' : '#ff9a52' });
}
function floatText(x, y, str, color) { texts.push({ x, y, str, color, life: 1 }); }
function fxTick(dt) {
  for (const p of parts) { p.life -= dt; p.x += p.vx*dt; p.y += p.vy*dt; p.vy += 500*dt; }
  parts = parts.filter(p => p.life > 0);
  for (const t of texts) { t.life -= dt; t.y -= 30*dt; }
  texts = texts.filter(t => t.life > 0);
  if (Math.random() < 0.12) smoke.push({ x: E.x + 18 + Math.random()*10, y: GROUND - 150,
    r: 5 + Math.random()*4, vy: -22 - Math.random()*14, life: 3 });
  for (const s of smoke) { s.life -= dt; s.y += s.vy*dt; s.x += 6*dt; s.r += 5*dt; }
  smoke = smoke.filter(s => s.life > 0);
}

// ---------- background ----------
function drawSky() {
  // bright, dramatic golden-hour sky
  const g = ctx.createLinearGradient(0, 0, 0, GROUND);
  g.addColorStop(0, '#4fb6e8'); g.addColorStop(0.55, '#a9e3d0');
  g.addColorStop(0.82, '#ffe9a8'); g.addColorStop(1, '#ffcf7d');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, GROUND);
  // sun with rays
  const sx = W * 0.42, sy = GROUND - 60;
  const sg = ctx.createRadialGradient(sx, sy, 10, sx, sy, 190);
  sg.addColorStop(0, '#fff6d8'); sg.addColorStop(0.25, '#ffe27acc'); sg.addColorStop(1, '#ffe27a00');
  ctx.fillStyle = sg; ctx.beginPath(); ctx.arc(sx, sy, 190, 0, 7); ctx.fill();
  ctx.save();
  ctx.globalAlpha = 0.18 + 0.05 * Math.sin(time);
  ctx.fillStyle = '#fff3c4';
  for (let i = 0; i < 7; i++) {
    ctx.save(); ctx.translate(sx, sy); ctx.rotate(-Math.PI * 0.15 - i * 0.13 + Math.sin(time * .3) * .02);
    ctx.fillRect(60, -6, 520, 12); ctx.restore();
  }
  ctx.restore();
  // drifting clouds
  ctx.fillStyle = '#ffffff88';
  for (let i = 0; i < 4; i++) {
    const cx = ((time * (8 + i * 4) + i * 300) % (W + 240)) - 120;
    const cy = 50 + i * 42;
    ctx.beginPath();
    ctx.ellipse(cx, cy, 62, 15, 0, 0, 7);
    ctx.ellipse(cx + 34, cy - 9, 38, 13, 0, 0, 7);
    ctx.fill();
  }
  // far hills with wind turbines
  ctx.fillStyle = '#7fcf9a';
  ctx.beginPath(); ctx.moveTo(0, GROUND);
  for (let x = 0; x <= W; x += 20) ctx.lineTo(x, GROUND - 34 - 26 * Math.sin(x / 170 + 1.2));
  ctx.lineTo(W, GROUND); ctx.fill();
  for (const tx of [260, 620, 860]) {
    const ty = GROUND - 44 - 26 * Math.sin(tx / 170 + 1.2);
    ctx.strokeStyle = '#e9fbee'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(tx, ty - 42); ctx.stroke();
    ctx.save(); ctx.translate(tx, ty - 42); ctx.rotate(time * 1.4 + tx);
    for (let b = 0; b < 3; b++) { ctx.rotate(Math.PI * 2 / 3);
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -18); ctx.stroke(); }
    ctx.restore();
  }
}
function drawGround() {
  const g = ctx.createLinearGradient(0, GROUND, 0, H);
  g.addColorStop(0, '#63b556'); g.addColorStop(1, '#33753c');
  ctx.fillStyle = g; ctx.fillRect(0, GROUND, W, H - GROUND);
  // meadow flowers (deterministic scatter)
  for (let i = 0; i < 46; i++) {
    const fx = (i * 137.5) % W, fy = GROUND + 12 + ((i * 71) % (H - GROUND - 20));
    ctx.fillStyle = ['#ffe27a', '#ff9ecb', '#ffffff', '#8affd9'][i % 4];
    ctx.fillRect(fx, fy, 3, 3);
  }
}

// ---------- bases ----------
function drawPlayerBase() {
  const x = P.x, gy = GROUND;
  // --- structure INSIDE the dome (drawn first, glass overlays it) ---
  ctx.fillStyle = '#8a6f4d'; ctx.fillRect(x - 40, gy - 100, 80, 100);      // earthen tower
  ctx.fillStyle = '#5da24f';
  for (let i = 0; i < 3; i++) ctx.fillRect(x - 40, gy - 90 + i * 30, 80, 6);  // vine terraces
  ctx.strokeStyle = '#4b3a26'; ctx.lineWidth = 4;                            // tree
  ctx.beginPath(); ctx.moveTo(x, gy - 100); ctx.lineTo(x, gy - 118); ctx.stroke();
  ctx.fillStyle = '#48a860'; ctx.beginPath(); ctx.arc(x, gy - 122, 11, 0, 7); ctx.fill();
  // --- solar cannon at the apex, barrel poking OUT the top of the dome ---
  if (cannon.built) {
    ctx.fillStyle = '#2d4a44'; ctx.beginPath(); ctx.arc(x, gy - 140, 13, 0, 7); ctx.fill();  // turret hub
    ctx.save(); ctx.translate(x, gy - 148); ctx.rotate(-Math.PI / 4);
    const len = 52 + cannon.dmgLvl * 6;
    ctx.fillStyle = '#e8b64c'; ctx.fillRect(0, -6, len, 12);
    ctx.shadowColor = PAL.shell; ctx.shadowBlur = 14;
    ctx.fillStyle = '#fff3c4'; ctx.fillRect(len - 6, -6, 6, 12);            // glowing muzzle
    ctx.restore();
  }
  // --- glass dome enclosing the WHOLE fortress ---
  ctx.save();
  ctx.shadowColor = PAL.allyGlow; ctx.shadowBlur = 22;
  ctx.fillStyle = 'rgba(150,238,220,0.20)';
  ctx.beginPath(); ctx.ellipse(x, gy, 60, 132, 0, Math.PI, 0); ctx.fill();
  ctx.restore();
  ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.ellipse(x, gy, 60, 132, 0, Math.PI, 0); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,0.22)'; ctx.lineWidth = 1;             // glass ribs
  for (const rr of [22, 42]) { ctx.beginPath(); ctx.ellipse(x, gy, rr, 132 * rr / 60, 0, Math.PI, 0); ctx.stroke(); }
  ctx.beginPath(); ctx.moveTo(x, gy); ctx.lineTo(x, gy - 132); ctx.stroke();
  hpBar(x, P);
}
function drawEnemyBase() {
  const x = E.x, gy = GROUND, acid = '#9bff3a';
  // gnarled toxic mass: dark jagged silhouette
  ctx.fillStyle = '#241a2b';
  ctx.beginPath();
  ctx.moveTo(x - 46, gy);
  ctx.lineTo(x - 40, gy - 68); ctx.lineTo(x - 24, gy - 94); ctx.lineTo(x - 6, gy - 74);
  ctx.lineTo(x + 10, gy - 102); ctx.lineTo(x + 30, gy - 70); ctx.lineTo(x + 46, gy - 90);
  ctx.lineTo(x + 46, gy); ctx.closePath(); ctx.fill();
  // crooked tendril spikes clawing upward
  ctx.strokeStyle = '#2e2338'; ctx.lineWidth = 6; ctx.lineCap = 'round';
  for (const [bx, by, ex, ey] of [[x-24,gy-88,x-42,gy-138],[x+10,gy-98,x+4,gy-150],[x+34,gy-78,x+54,gy-120]]) {
    ctx.beginPath(); ctx.moveTo(bx, by); ctx.quadraticCurveTo((bx+ex)/2 + 10, (by+ey)/2, ex, ey); ctx.stroke();
  }
  ctx.lineCap = 'butt';
  // toxic pustule glow
  ctx.save(); ctx.shadowColor = acid; ctx.shadowBlur = 12; ctx.fillStyle = acid;
  for (const [px, py, r] of [[x-18,gy-52,6],[x+14,gy-60,7],[x-2,gy-28,5],[x+28,gy-38,4]])
    { ctx.beginPath(); ctx.arc(px, py, r, 0, 7); ctx.fill(); }
  ctx.restore();
  // enemy cannon barrel poking out toward the meadow (up-left, crooked)
  ctx.save(); ctx.translate(x - 8, gy - 92); ctx.rotate(Math.PI * 0.78);
  ctx.fillStyle = '#3a2e46'; ctx.fillRect(0, -5, 42, 10);
  ctx.shadowColor = acid; ctx.shadowBlur = 8; ctx.fillStyle = acid; ctx.fillRect(36, -5, 6, 10);
  ctx.restore();
  hpBar(x, E);
}
function drawVinePatch(vn) {
  const a = Math.min(1, vn.life / 1.5);
  ctx.save(); ctx.globalAlpha = 0.55 * a; ctx.strokeStyle = '#7bd85a'; ctx.lineWidth = 3; ctx.lineCap = 'round';
  for (let i = -3; i <= 3; i++) {
    ctx.beginPath(); ctx.moveTo(vn.x + i * 9, GROUND);
    ctx.quadraticCurveTo(vn.x + i * 9 + 4, GROUND - 16 - (i % 2 ? 6 : 0), vn.x + i * 9 - 3, GROUND - 28);
    ctx.stroke();
  }
  ctx.restore();
}
function drawVoid(v) {
  const k = v.t / v.dur, r = ABILITIES.void.radius * (1 - k * 0.15);
  ctx.save(); ctx.translate(v.x, GROUND - 40);
  const g = ctx.createRadialGradient(0, 0, 4, 0, 0, r);
  g.addColorStop(0, 'rgba(28,10,48,0.88)'); g.addColorStop(0.5, 'rgba(120,80,200,0.32)'); g.addColorStop(1, 'rgba(120,80,200,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.fill();
  ctx.rotate(v.t * 6); ctx.strokeStyle = 'rgba(198,155,255,0.8)'; ctx.lineWidth = 3;
  for (let i = 0; i < 3; i++) { ctx.rotate(2.1); ctx.beginPath(); ctx.arc(0, 0, 14 + i * 7, 0, 2.4); ctx.stroke(); }
  ctx.restore();
}
function hpBar(x, b) {
  ctx.fillStyle = '#0007'; ctx.fillRect(x - 45, GROUND - 186, 90, 9);
  ctx.fillStyle = b === P ? PAL.allyGlow : PAL.foeGlow;
  ctx.fillRect(x - 45, GROUND - 186, 90 * Math.max(0, b.hp) / b.maxHp, 9);
}

// ---------- silhouette troops ----------
function drawUnit(u) {
  const cfg = UNITS[u.type];
  const s = cfg.size, dir = u.side;
  const sil = u.side === 1 ? PAL.allySil : PAL.foeSil;
  const glow = u.side === 1 ? PAL.allyGlow : PAL.foeGlow;
  const bob = Math.sin(time * 9 + u.phase) * 1.6;
  const x = u.x, y = GROUND + bob * 0.3;
  ctx.save();
  ctx.translate(x, y); ctx.scale(dir * s, s);
  ctx.fillStyle = sil;
  // legs (simple stride)
  const st = Math.sin(time * 9 + u.phase) * 5;
  ctx.beginPath(); ctx.moveTo(-2, -14); ctx.lineTo(-4 + st, 0); ctx.lineTo(-1 + st, 0); ctx.lineTo(1, -14); ctx.fill();
  ctx.beginPath(); ctx.moveTo(0, -14);  ctx.lineTo(2 - st, 0);  ctx.lineTo(5 - st, 0);  ctx.lineTo(3, -14); ctx.fill();
  // torso + head
  ctx.beginPath();
  ctx.moveTo(-5, -14); ctx.quadraticCurveTo(-6, -26, -3, -28);
  ctx.lineTo(5, -28); ctx.quadraticCurveTo(7, -22, 5, -14); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.arc(1, -32, 4.6, 0, 7); ctx.fill();
  // gear per class (still silhouette)
  if (u.type === 'grunt') {                       // Warden: leaf-blade
    ctx.save(); ctx.translate(6, -24); ctx.rotate(u.cd > 0.4 ? -0.9 : -0.2);
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(10, -6, 15, -14);
    ctx.quadraticCurveTo(8, -8, 0, -3); ctx.fill(); ctx.restore();
  } else if (u.type === 'archer') {               // Thornshot: bow
    ctx.strokeStyle = sil; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(8, -24, 9, -1.2, 1.2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(8 + 9*Math.cos(-1.2), -24 + 9*Math.sin(-1.2));
    ctx.lineTo(8 + 9*Math.cos(1.2), -24 + 9*Math.sin(1.2)); ctx.stroke();
  } else {                                        // Oakguard: bark shield
    ctx.beginPath();
    ctx.moveTo(7, -30); ctx.quadraticCurveTo(15, -24, 13, -10);
    ctx.quadraticCurveTo(9, -6, 6, -10); ctx.closePath(); ctx.fill();
  }
  // glowing accents: visor + chest sigil
  ctx.shadowColor = glow; ctx.shadowBlur = 8; ctx.fillStyle = glow;
  ctx.fillRect(2.4, -33, 3.4, 1.6);              // visor
  ctx.beginPath(); ctx.arc(0.5, -22, 1.6, 0, 7); ctx.fill();  // sigil
  ctx.restore();
  // rooted-in-vines indicator (world space)
  if (u.root > 0) {
    ctx.save(); ctx.strokeStyle = '#7bd85a'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
    for (let i = -1; i <= 1; i++) {
      ctx.beginPath(); ctx.moveTo(x + i * 7, GROUND);
      ctx.quadraticCurveTo(x + i * 7 + 3, GROUND - 14, x + i * 7 - 2, GROUND - 24); ctx.stroke();
    }
    ctx.restore();
  }
  // hp bar
  const bw = 26 * s;
  ctx.fillStyle = '#0007'; ctx.fillRect(x - bw/2, GROUND - 44 * s, bw, 3.5);
  ctx.fillStyle = glow;    ctx.fillRect(x - bw/2, GROUND - 44 * s, bw * u.hp / u.maxHp, 3.5);
}

// ---------- render ----------
function render() {
  ctx.clearRect(0, 0, W, H);
  drawSky(); drawGround();
  // cannon range marker
  if (cannon.built) {
    const rx = cannonRangeX();
    ctx.strokeStyle = '#ffffff55'; ctx.setLineDash([6, 8]);
    ctx.beginPath(); ctx.moveTo(rx, 70); ctx.lineTo(rx, GROUND); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = '#ffffff88'; ctx.font = '11px sans-serif';
    ctx.fillText('cannon range', rx - 70, 84);
  }
  // enemy smog
  for (const s of smoke) { ctx.globalAlpha = Math.min(.4, s.life * .18); ctx.fillStyle = '#4a4450';
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 7); ctx.fill(); }
  ctx.globalAlpha = 1;
  for (const vn of vines) drawVinePatch(vn);           // vine tangles on the ground
  drawPlayerBase(); drawEnemyBase();
  for (const u of units) drawUnit(u);
  for (const v of voids) drawVoid(v);                  // black-hole swirls over the field
  // shells arc in, tinted by ammo type
  for (const s of shells) {
    const k = s.t / s.dur;
    const x = s.x + (s.tx - s.x) * k;
    const y = s.y + (GROUND - s.y) * k - Math.sin(k * Math.PI) * 160;
    const col = SHELL_COLORS[s.type] || '#fff6d8';
    ctx.save(); ctx.shadowColor = col; ctx.shadowBlur = 20;
    ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x, y, s.type === 'bomb' ? 9 : 7, 0, 7); ctx.fill();
    ctx.restore();
  }
  for (const p of parts) { ctx.globalAlpha = Math.max(0, p.life * 2); ctx.fillStyle = p.color;
    ctx.fillRect(p.x - 3, p.y - 3, 6, 6); }
  ctx.globalAlpha = 1;
  ctx.font = 'bold 15px sans-serif';
  for (const t of texts) { ctx.globalAlpha = t.life; ctx.fillStyle = t.color; ctx.fillText(t.str, t.x - 12, t.y); }
  ctx.globalAlpha = 1;
}

// ---------- hud ----------
function btn(el, label, cost, enabled) {
  el.innerHTML = label + (cost != null ? `<span class="cost">☀ ${cost}</span>` : '');
  el.disabled = !enabled;
}
function hud() {
  $('gold').textContent = '☀ ' + Math.floor(P.gold);
  btn($('bGrunt'),  UNITS.grunt.label,  UNITS.grunt.cost,  P.gold >= UNITS.grunt.cost);
  btn($('bArcher'), UNITS.archer.label, UNITS.archer.cost, P.gold >= UNITS.archer.cost);
  btn($('bTank'),   UNITS.tank.label,   UNITS.tank.cost,   P.gold >= UNITS.tank.cost);
  const eMax = P.econLvl >= ECON_COSTS.length;
  btn($('bEcon'), eMax ? '🌻 Harvest MAX' : '🌻 Harvest +', eMax ? null : ECON_COSTS[P.econLvl],
      !eMax && P.gold >= ECON_COSTS[P.econLvl]);
  // cannon row
  const st = $('cannonStatus');
  if (!cannon.built) {
    st.textContent = 'Solar Cannon: not built';
    $('bBuild').style.display = ''; $('bRange').style.display = 'none'; $('bDamage').style.display = 'none';
    btn($('bBuild'), '🔨 Build Cannon', CANNON_BUILD_COST, P.gold >= CANNON_BUILD_COST);
  } else {
    st.textContent = `Solar Cannon: Range ${cannon.rangeLvl}/3 · Damage ${cannon.dmgLvl}/3 · Upgrades ${cannon.upgrades}/3`;
    $('bBuild').style.display = 'none';
    const done = cannon.upgrades >= 3;
    const cost = done ? null : CANNON_UPG_COSTS[cannon.upgrades];
    const forceRange = cannon.upgrades === 0;
    $('bRange').style.display = ''; $('bDamage').style.display = '';
    btn($('bRange'), forceRange ? '📏 Range (required 1st)' : '📏 Range +',
        cost, !done && cannon.rangeLvl < 3 && P.gold >= cost);
    btn($('bDamage'), '💥 Damage +',
        cost, !done && !forceRange && cannon.dmgLvl < 3 && P.gold >= cost);
    if (done) { btn($('bRange'), '📏 Range ' + cannon.rangeLvl + '/3', null, false);
                btn($('bDamage'), '💥 Damage ' + cannon.dmgLvl + '/3', null, false); }
  }
  // ability buttons (appear once the cannon is built)
  $('abilityLabel').style.visibility = cannon.built ? 'visible' : 'hidden';
  for (const [id, kind] of [['bVine', 'vine'], ['bBomb', 'bomb'], ['bVoid', 'void']]) {
    const el = $(id);
    el.style.display = cannon.built ? '' : 'none';
    if (!cannon.built) continue;
    const cd = cannon.abilityCd[kind], max = ABILITIES[kind].cd, ready = cd <= 0;
    el.disabled = !ready || over;
    el.innerHTML = ABILITIES[kind].label
      + (ready ? '<span class="cost">ready</span>' : `<span class="cost">${cd.toFixed(1)}s</span>`)
      + `<span class="cd" style="width:${ready ? 0 : (cd / max * 100)}%"></span>`;
  }
}

// ---------- main loop ----------
function end(win) {
  over = true;
  $('overlay').style.display = 'flex';
  $('ovTitle').textContent = win ? '🌞 Victory!' : '🥀 Dome Overrun';
  $('ovSub').textContent = win ? 'The smog rig falls — the meadow breathes again.'
                               : 'The garden is ash. Replant and try again.';
}
function restart() {
  Object.assign(P, { hp: 1000, maxHp: 1000, gold: 120, income: 6, econLvl: 0, x: 60 });
  Object.assign(E, { hp: 1000, maxHp: 1000, gold: 120, income: 6, x: W - 60 });
  Object.assign(cannon, { built: false, upgrades: 0, rangeLvl: 0, dmgLvl: 0, cd: 0, fireRate: 3.2,
                          abilityCd: { vine: 0, bomb: 0, void: 0 } });
  ecannon.cd = 2.5;
  units = []; shells = []; parts = []; texts = []; smoke = []; voids = []; vines = [];
  over = false; time = 0; aiTimer = 1.5; aiWave = 0;
  $('overlay').style.display = 'none';
}
$('bReplay').onclick = restart;
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (!over) {
    time += dt;
    P.gold += P.income * dt;
    aiThink(dt);
    unitTick(dt);
    cannonTick(dt);
    enemyCannonTick(dt);
    shellTick(dt);
    applyVoids(dt);
    fxTick(dt);
    if (E.hp <= 0) end(true);
    else if (P.hp <= 0) end(false);
  }
  render(); hud();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
